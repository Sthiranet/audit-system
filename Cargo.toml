[workspace]
resolver = "3"
members = [
  "crates/sthira-core",
  "crates/sthira-connector",
  "crates/sthira-ledger",
  "crates/sthira-batcher",
  "crates/sthira-verify",
  "crates/sthira-node",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
sthira-core = { path = "crates/sthira-core" }
sthira-connector = { path = "crates/sthira-connector" }
sthira-ledger = { path = "crates/sthira-ledger" }
sthira-batcher = { path = "crates/sthira-batcher" }
sthira-verify = { path = "crates/sthira-verify" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
proptest = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
