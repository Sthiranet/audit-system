[workspace]
resolver = "3"
members = [
  "crates/sthira-core",
  "crates/sthira-ledger",
  "crates/sthira-profiles",
  "crates/sthira-batcher",
  "crates/sthira-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
sthira-core = { path = "crates/sthira-core" }
sthira-ledger = { path = "crates/sthira-ledger" }
sthira-profiles = { path = "crates/sthira-profiles" }
sthira-batcher = { path = "crates/sthira-batcher" }
sthira-verify = { path = "crates/sthira-verify" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
utoipa = { version = "5", features = ["preserve_order"] }
proptest = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
clap = { version = "4", features = ["derive", "env"] }
